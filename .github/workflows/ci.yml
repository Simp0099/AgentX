name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src/ app/ tests/ scripts/ agent/

      - name: Tests
        # Tests build the model with weights=None, so no ImageNet download and
        # no GPU is needed -- the whole suite runs on a free CI runner.
        run: pytest tests/ -v
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
