data:
  root: data/CASIA2          # path to CASIA2/ folder (Au/, Tp/, groundtruth/)
  image_size: [224, 224]
  ela_quality: 90            # JPEG quality for ELA re-encode; 90 is standard
  val_frac: 0.2
  test_frac: 0.2
  seed: 42

training:
  batch_size: 32
  epochs_frozen: 10          # phase 1: backbone frozen  (Project 1 pattern)
  epochs_finetune: 10        # phase 2: unfreeze last 30 layers
  fine_tune_from: -30        # negative = from-end indexing into backbone layers
  lr_frozen: 1.0e-3
  lr_finetune: 1.0e-5
  bbox_loss_weight: 1.0      # λ in: total_loss = BCE + λ·masked_MSE
  patience: 4                # EarlyStopping patience (Project 1 pattern)

output:
  checkpoint_dir: checkpoints/
  checkpoint_name: best_localizer.keras
  log_dir: logs/
  threshold: 0.5

forensics:
  max_image_pixels: 40000000
  max_file_bytes: 50000000
  min_box_area: 0.001
  max_box_coverage: 0.95
  ela_temp_dir: artifacts/ela
  tool_timeout_seconds: 10
  planner_budget: 4
  uncertain_low: 0.4
  uncertain_high: 0.6
